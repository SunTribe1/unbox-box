[project]
name = "unbox-box-pipeline"
version = "0.1.0"
description = "Builds the static data files Unbox Box serves: fetch, normalize, resample, publish."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
unbox-box-pipeline = "unbox_box_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unbox_box_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline CSV fixtures

[tool.pytest.ini_options]
testpaths = ["tests"]
