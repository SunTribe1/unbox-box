name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: input
    id: link
    attributes:
      label: Link to the page
      description: Copy it from the address bar, so we open exactly what you saw.
      placeholder: https://…/replay/?s=2025-italian-grand-prix-r&at=1834
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: Steps, then expected vs. actual.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome 150 on macOS, Safari on iPhone 15…
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
