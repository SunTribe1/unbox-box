name: Build session data

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        default: '2025'
      event:
        description: Event name, e.g. Italian Grand Prix
        required: true
      session:
        description: Session, e.g. Qualifying
        default: Qualifying

# Builds one session and uploads it as an artifact. main is protected, so data changes land
# through a pull request like any other change: download the artifact, add it, open a PR.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Inputs reach the shell through env vars, never ${{ }} inside `run`, so a crafted
      # event name can't inject commands.
      - name: Build data
        working-directory: pipeline
        env:
          SEASON: ${{ inputs.season }}
          EVENT: ${{ inputs.event }}
          SESSION: ${{ inputs.session }}
        run: >
          uv run unbox-box-pipeline build
          --season "$SEASON"
          --event "$EVENT"
          --session "$SESSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-data
          path: apps/web/public/data
          retention-days: 7
