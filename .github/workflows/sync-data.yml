name: Sync session data

# Builds every session TracingInsights has published that isn't on the Hugging Face dataset
# yet, then uploads it. TracingInsights publishes within about 3 hours of a session.
#
# Schedule (UTC): every 3 hours Friday to Monday, when sessions run (late races in the
# Americas end on Sunday night or Monday UTC), so new data lands within ~6 hours; once a day
# Tuesday to Thursday for late or corrected uploads and the post-race F1DB update. No
# calendar is hard-coded: each run builds only what's new, so a quiet run takes a minute.
#
# Setup (once): add repository secret HF_TOKEN (a Hugging Face write token) and repository
# variable HF_DATASET (e.g. your-name/unbox-box-data).

on:
  schedule:
    - cron: '17 */3 * * 5,6,0,1'
    - cron: '17 6 * * 2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild sessions that are already published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    # Skipped until the dataset is configured, so a fork or a fresh clone doesn't spend hours
    # rebuilding the archive only to fail at the upload.
    if: vars.HF_DATASET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync and publish
        working-directory: pipeline
        env:
          HF_DATASET: ${{ vars.HF_DATASET }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: >
          uv run --with 'huggingface_hub>=0.25,<2' unbox-box-pipeline sync
          --seasons 2023-2026
          --published-index "https://huggingface.co/datasets/$HF_DATASET/resolve/main/index.json"
          --publish "$HF_DATASET"
          $FORCE
      - name: Report
        if: always()
        run: cat data/sync-report.json 2>/dev/null || echo "no report"
